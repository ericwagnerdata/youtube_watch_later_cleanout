[project]
name = "wl-cleanup"
version = "0.1.0"
description = "Watch Later backlog cleanup via Playwright and Claude"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "streamlit>=1.30",
    "python-dotenv>=1.0",
    "youtube-transcript-api>=0.6",
    "yt-dlp>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wl_cleanup"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
